[project]
name = "public-people-data"
version = "0.1.0"
description = "Public People of South Africa: politician data, memberships and news timelines"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Django>=6.1",
    "dj-database-url>=3.1.2",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=8.0.0",
    "django-environ>=0.14.0",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-model-utils>=5.0.0",
    "django-pipeline>=4.1.0",
    "django-simple-history>=3.13.0",
    "django-ajax-selects>=3.0.3",
    "djangorestframework>=3.18.3",
    "gevent>=26.9.0",
    "graphene-django>=3.2.3",
    "gunicorn>=26.2.0",
    "libsass>=0.23.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "sentry-sdk>=2.73.0",
    "Werkzeug>=3.1.3",
    "whitenoise>=6.12.0",
    "mysociety-django-popolo",
    "multiple-django-popolo-sources",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mysociety-django-popolo = { git = "https://github.com/public-people/django-popolo.git", branch = "public-people" }
multiple-django-popolo-sources = { git = "https://github.com/public-people/multiple-django-popolo-sources.git", branch = "master" }

[tool.coverage.run]
source = ["publicpeople"]

[tool.coverage.report]
show_missing = true
skip_covered = true
